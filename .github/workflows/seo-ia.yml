name: Actualizar SEO para buscadores e IAs
# Cada vez que cambias propiedades.js o una página, esto vuelve a generar
# la lista estática de propiedades, los datos estructurados y /llms.txt.
on:
  push:
    branches: [main]
    paths:
      - 'propiedades.js'
      - '**/index.html'
      - 'herramientas/generar-seo.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node herramientas/generar-seo.js
      - name: Guardar cambios
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "jegar-seo-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "SEO: actualizar lista estática, datos estructurados y llms.txt"
            git push
          fi
